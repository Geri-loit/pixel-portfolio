<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李洁瑜 · 存档点</title>
<style>
:root{
  --deep:#0b1c22; --panel:#122e37; --panel2:#183c46; --line:#061114;
  --amber:#f2b23c; --mint:#79e3c3; --cream:#f3e6c8; --dim:#a9b9b5; --plum:#e07a5f;
  --px:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--deep);color:var(--cream);
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.08em}
img{display:block}

.bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
.bg img{width:100%;height:100%;object-fit:cover;object-position:center 42%;image-rendering:pixelated}
.bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 95% at 50% 38%,rgba(8,22,28,.34),rgba(6,17,22,.86) 82%),
             linear-gradient(180deg,rgba(6,17,22,.66),rgba(6,17,22,.22) 32%,rgba(6,17,22,.88))}
.scan{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,transparent 1px 4px)}

.win{position:relative;background:var(--panel);border:var(--px) solid var(--line);
  box-shadow:6px 6px 0 rgba(0,0,0,.55), inset 0 0 0 2px rgba(243,230,200,.06)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2);
  border-bottom:var(--px) solid var(--line);font-size:11px;letter-spacing:.16em;color:var(--dim)}
.bar i{width:10px;height:10px;background:var(--amber);box-shadow:0 0 0 2px var(--line) inset}
.bar b{color:var(--cream);font-weight:700}

.wrap{width:min(880px,calc(100% - 48px));margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}

/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px}
.back{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream);
  font-size:14px;letter-spacing:.12em;border:3px solid var(--line);background:rgba(11,28,34,.72);
  padding:13px 20px;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.back:hover{background:var(--amber);color:#0d2027}
.topbar .file{font-size:11px;color:var(--mint);letter-spacing:.24em}

.head{display:flex;align-items:stretch;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;font-size:13px;letter-spacing:.2em;color:var(--amber);border:2px solid var(--amber);padding:0 10px}
.head h2{font-size:clamp(22px,2.6vw,30px);line-height:1.1;letter-spacing:.08em;text-shadow:2px 2px 0 #061114}
.head .note{font-size:11px;color:var(--dim);margin-left:auto;letter-spacing:.1em;align-self:center}

/* 面板 */
.body{padding:32px 28px}
.nm{font-size:32px;letter-spacing:.06em;text-shadow:2px 2px 0 #061114}
.role{font-size:11px;color:var(--mint);letter-spacing:.18em;margin-top:8px}

.slots{display:grid;gap:0;margin-top:18px}
.slot{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:20px 0;
  border-bottom:2px dashed rgba(243,230,200,.14);align-items:center}
.slot span:first-child{font-size:11px;letter-spacing:.14em;color:var(--mint)}
.slot span:last-child{font-size:13px;color:var(--cream)}

.block-lbl{font-size:10px;letter-spacing:.2em;color:var(--amber);margin:34px 0 14px;display:block}
.intro{padding:18px 20px;border-left:3px solid var(--amber);
  background:rgba(11,28,34,.55);font-size:12.5px;line-height:2;color:var(--cream)}

.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:18px 24px;text-decoration:none;
  color:#0d2027;background:var(--amber);border:3px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.5);
  font-size:14px;font-weight:700;letter-spacing:.1em}
.btn:hover{transform:translate(-1px,-1px);background:var(--mint)}

@media(max-width:900px){
  body{overflow:auto}
}
</style>
</head>
<body>

<div class="bg"><img src="assets/bg-typing.gif" alt=""></div>
<div class="scan"></div>

<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">◀ 返回菜单</a>
    <span class="file mono">存档 04 · 存档点</span>
  </div>

  <div class="head">
    <span class="tag">04</span><h2>存档点</h2><span class="note">联系与简历</span>
  </div>

  <section class="win">
    <div class="bar"><i></i><b>联络存档</b></div>
    <div class="body">
      <div class="nm">李洁瑜</div>
      <div class="role mono">剪辑 / AI 影像</div>

      <div class="slots">
        <div class="slot"><span>邮箱</span><span>sinese551188@163.com</span></div>
      </div>

      <span class="block-lbl mono">简历存档</span>
      <div class="intro">
        完整履历已整理为 PDF，包含教育背景、技能与项目经历，可直接下载。
      </div>
      <div class="actions">
        <a class="btn" href="assets/李洁瑜-简历.pdf">⬇ 下载简历（PDF）</a>
      </div>

      <span class="block-lbl mono">留言</span>
      <div class="intro">
        感谢浏览我的作品与履历，如有合作或面试机会，欢迎通过电话或邮箱联系我。
      </div>
    </div>
  </section>
</div>

</body>
</html>
